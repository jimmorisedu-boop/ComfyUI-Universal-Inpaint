name: Feature request
description: Suggest a portable improvement
title: "[feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach personal media, model weights, secrets or private deployment evidence.
  - type: input
    id: version
    attributes:
      label: Universal Inpaint version/commit
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: platform
    attributes:
      label: OS, Python and ComfyUI version
