name: Bug report
description: Report a reproducible Universal Inpaint problem
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please redact personal media, prompts, tokens, host paths and model files.
  - type: input
    id: version
    attributes:
      label: Universal Inpaint version
      placeholder: 0.1.0 or commit
    validations:
      required: true
  - type: input
    id: comfyui
    attributes:
      label: ComfyUI version/commit
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and Python version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a placeholder filename; do not upload personal video.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted logs
    validations:
      required: true
  - type: textarea
    id: debug_log
    attributes:
      label: Optional debug export
      description: Remove media URLs, prompts, tokens, fingerprints and local paths before attaching.
