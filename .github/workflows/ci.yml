name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-and-frontend:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Python tests
        run: python -m pytest -q
      - name: JavaScript tests
        run: python -c "import pathlib, subprocess, sys; files=sorted(str(p) for p in pathlib.Path('tests').glob('*.test.mjs')); raise SystemExit(subprocess.call(['node', '--test', *files]))"
