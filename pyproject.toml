[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-universal-inpaint"
version = "0.2.0"
description = "ComfyUI interactive video object selection and mask tracking editor node (SAM3, Optical Flow, Keyframes, Static)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [{ name = "jimmorisedu-boop" }]
maintainers = [{ name = "jimmorisedu-boop" }]
keywords = ["comfyui", "video", "mask", "mask-editor", "segmentation", "sam3", "optical-flow"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
cpu = ["opencv-python>=4.8", "Pillow>=10"]
dev = ["pytest>=8", "opencv-python>=4.8", "Pillow>=10"]

[project.urls]
Homepage = "https://github.com/jimmorisedu-boop/ComfyUI-Universal-Inpaint"
Repository = "https://github.com/jimmorisedu-boop/ComfyUI-Universal-Inpaint"
Issues = "https://github.com/jimmorisedu-boop/ComfyUI-Universal-Inpaint/issues"

[tool.setuptools]
include-package-data = true
py-modules = [
  "__init__",
  "mask_core",
  "mask_nodes",
  "mask_progress",
  "mask_sam3",
  "mask_sam3_video",
]

[tool.setuptools.data-files]
"web" = ["web/*"]
"locales/ru" = ["locales/ru/nodeDefs.json"]
"workflows" = ["workflows/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
